---
- name: Deploy SMC Trading Bot to VPS
  hosts: trading_vps
  become: true
  vars:
    project_dir: /home/botuser/Bot
    venv_dir: /home/botuser/Bot/venv
    wine_prefix: /home/botuser/.mt5

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install system dependencies
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - wine
          - wine32
          - wine64
          - git
          - build-essential
        state: present

    - name: Create project directory
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy project files
      synchronize:
        src: ../../
        dest: "{{ project_dir }}"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=venv"
          - "--exclude=__pycache__"
          - "--exclude=*.pyc"
          - "--exclude=config/.env"
          - "--exclude=config/.env.production"

    - name: Create virtual environment and install requirements
      pip:
        requirements: "{{ project_dir }}/requirements.txt"
        virtualenv: "{{ venv_dir }}"
        virtualenv_python: python3

    - name: Copy production environment file
      copy:
        src: ../../config/.env.production
        dest: "{{ project_dir }}/config/.env"
        owner: "{{ ansible_user }}"
        mode: "0600"

    - name: Install systemd service
      template:
        src: smc-bot.service.j2
        dest: /etc/systemd/system/smc-bot.service
      notify: restart smc-bot

    - name: Enable and start service
      systemd:
        name: smc-bot
        enabled: true
        state: started
        daemon_reload: true

    - name: Setup cron for backups
      cron:
        name: smc-bot backup
        minute: "0"
        hour: "*/6"
        job: "cd {{ project_dir }} && {{ venv_dir }}/bin/python scripts/backup.py >> {{ project_dir }}/logs/backup.log 2>&1"

  handlers:
    - name: restart smc-bot
      systemd:
        name: smc-bot
        state: restarted
